trigger:
  branches:
    include:
    - main
    - develop
  paths:
    include:
    - frontend/*

pr:
  branches:
    include:
    - main
    - develop

variables:
  dockerRegistryServiceConnection: 'your-registry-connection'
  imageRepository: 'product-frontend'
  containerRegistry: 'yourregistryname.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/frontend/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and Push to Registry
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Install Node.js'
    
    - script: |
        cd frontend
        npm ci
        npm run lint
        npm run build
      displayName: 'Install dependencies, lint and build'
      continueOnError: true
    
    - task: Docker@2
      displayName: Build and push image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to Azure App Service
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    
    environment: 'production'
    
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure Web App for Containers'
            inputs:
              azureSubscription: 'your-azure-subscription'
              appName: 'your-app-service-name'
              containers: $(containerRegistry)/$(imageRepository):$(tag)
              multicontainerConfigFile: ''
              imagesToPull: $(containerRegistry)/$(imageRepository):$(tag)
              registryLoginUsername: 'your-registry-username'
              registryLoginPassword: 'your-registry-password'
